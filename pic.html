<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gift Image Reveal</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #1a1a2e, #000);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* GIFT */
.gift {
    position: relative;
    width: 180px;
    height: 180px;
    cursor: pointer;
}

/* BOX */
.base {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #ff0055, #ff4d6d);
    border-radius: 15px;
    position: absolute;
    box-shadow: 0 0 25px rgba(255, 0, 100, 0.7);
}

/* RIBBON */
.ribbon-v, .ribbon-h {
    position: absolute;
    background: gold;
}

.ribbon-v {
    width: 20px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
}

.ribbon-h {
    height: 20px;
    width: 100%;
    top: 50%;
    transform: translateY(-50%);
}

/* LID */
.lid {
    position: absolute;
    width: 100%;
    height: 60px;
    background: #cc0044;
    top: -50px;
    border-radius: 15px 15px 0 0;
    transform-origin: bottom;
    transition: transform 1s ease;
}

/* BOW */
.bow {
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 40px;
}

/* OPEN */
.open .lid {
    transform: rotateX(140deg);
}

/* LIGHT */
.light {
    position: absolute;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, white, transparent 70%);
    top: -80px;
    left: -35px;
    opacity: 0;
}

.open .light {
    animation: glow 1s forwards;
}

@keyframes glow {
    from {opacity:0; transform: scale(0.5);}
    to {opacity:1; transform: scale(1.5);}
}

/* IMAGE INSIDE GIFT */
.image {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transform: scale(0.5);
}

.image img {
    width: 140px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
}

/* SHOW IMAGE WHEN OPEN */
.open .image {
    animation: showImage 1.2s forwards 0.6s;
}

@keyframes showImage {
    0% {
        opacity: 0;
        transform: scale(0.5);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* SPARKLES */
.sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity: 0;
}

.open .sparkle {
    animation: explode 1s forwards;
}

@keyframes explode {
    from {opacity:1; transform: translate(0,0);}
    to {opacity:0; transform: translate(var(--x), var(--y));}
}

</style>
</head>

<body>

<div class="gift" onclick="openGift(this)">
    <div class="lid"></div>
    <div class="bow">🎀</div>

    <div class="base"></div>
    <div class="ribbon-v"></div>
    <div class="ribbon-h"></div>

    <div class="light"></div>

    <!-- IMAGE ONLY -->
    <div class="image">
        <img src="bleh.jfif" alt="Surprise Image">
    </div>

    <!-- sparkles -->
    <div class="sparkle" style="--x:120px; --y:-150px;"></div>
    <div class="sparkle" style="--x:-120px; --y:-120px;"></div>
    <div class="sparkle" style="--x:100px; --y:100px;"></div>
    <div class="sparkle" style="--x:-100px; --y:120px;"></div>
</div>

<script>
function openGift(el) {
    el.classList.add("open");
}
</script>

</body>
</html>
